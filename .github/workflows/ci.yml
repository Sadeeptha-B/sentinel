# The automated checks from docs/TESTING.md, on Windows (the primary target) and
# Linux (where the build would otherwise break silently: stage.rs and ticker.rs
# have Windows-only branches).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push supersedes a PR's earlier run, but every commit on main gets checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-latest
          - label: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Frontend tests
        run: npm test
      # Also produces dist/, which the Rust build embeds.
      - name: Frontend build
        run: npm run build

      # With no arguments, installs the version pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
