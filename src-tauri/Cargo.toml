[package]
name = "sentinel"
version = "0.1.0"
description = "A quiet desktop companion: a battle-worn knight standing watch."
authors = ["Sadeeptha Bandara"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "sentinel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Atomic move+resize (feet-anchored scaling without a one-frame jump), and reading
# geometry and DPI straight from the OS from any thread.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
